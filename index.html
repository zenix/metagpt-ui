<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MetaGPT Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #6c8aff;
    --accent2: #a78bfa;
    --green: #4ade80;
    --red: #f87171;
    --yellow: #fbbf24;
    --text: #e2e8f0;
    --muted: #8892a4;
    --font: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--accent); flex: 1; }
  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    font-size: 11px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    transition: background 0.3s;
  }
  .dot.running { background: var(--green); }
  .btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-family: var(--font);
    font-size: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #5a78ee; }
  .btn.danger { background: transparent; border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: rgba(248,113,113,0.1); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Main layout */
  main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left panel — project list */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    gap: 6px;
    flex-shrink: 0;
  }
  .project-list {
    overflow-y: auto;
    flex: 1;
  }
  .project-item {
    padding: 10px 12px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .project-item:hover { background: var(--surface2); }
  .project-item.selected { background: var(--surface2); border-left: 3px solid var(--accent); }
  .project-item .pname {
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .project-item .pmeta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tag {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
    margin-left: 4px;
  }
  .tag.inc { background: rgba(167,139,250,0.2); color: var(--accent2); }
  .del-btn { visibility: hidden; }
  .project-item:hover .del-btn { visibility: visible; }

  /* Right panel */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .form-area {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .form-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .form-row:last-child { margin-bottom: 0; }
  label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; }
  textarea, input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 7px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  textarea:focus, input:focus, select:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 64px; }
  select option { background: var(--surface2); }

  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .selected-label {
    font-size: 11px;
    color: var(--muted);
    padding: 4px 8px;
    background: var(--surface2);
    border-radius: 4px;
    border: 1px solid var(--border);
  }
  .selected-label span { color: var(--accent2); }

  /* Pipeline strip */
  .pipe-step {
    padding: 3px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    transition: background 0.3s, color 0.3s, border-color 0.3s;
    white-space: nowrap;
  }
  .pipe-step.active {
    background: rgba(108,138,255,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .pipe-step.done {
    background: rgba(74,222,128,0.1);
    border-color: var(--green);
    color: var(--green);
  }
  .pipe-arrow { padding: 3px 5px; color: var(--muted); font-size: 11px; }

  /* Log output */
  .log-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    flex-shrink: 0;
  }
  .log-status {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .log-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--muted);
  }
  .log-dot.active {
    background: var(--green);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .log-output {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-all;
    color: #c9d1e0;
  }
  .log-output .line-meta { color: var(--accent); }
  .log-output .line-err  { color: var(--red); }
  .log-output .line-ok   { color: var(--green); }
  .log-output .line-warn { color: var(--yellow); }

  /* File browser */
  #fileTree {
    width: 220px;
    flex-shrink: 0;
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 4px 0;
  }
  .tree-item {
    padding: 4px 10px;
    cursor: pointer;
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--muted);
  }
  .tree-item:hover { background: var(--surface2); color: var(--text); }
  .tree-item.selected { background: var(--surface2); color: var(--accent); }
  #fileViewer {
    flex: 1;
    overflow: auto;
    padding: 12px 16px;
    font-size: 12px;
    line-height: 1.6;
  }
  #fileViewer pre { white-space: pre-wrap; word-break: break-all; }

  /* Modals */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    overflow: auto;
    padding: 24px;
  }
  .modal-box {
    max-width: 800px;
    margin: 0 auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .modal-title { font-size: 14px; font-weight: 600; }
  .summary-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .summary-card-title { font-weight: 600; color: var(--accent2); margin-bottom: 8px; font-size: 12px; }
  .summary-field-label { color: var(--muted); font-size: 10px; margin-top: 8px; margin-bottom: 2px; }
  .summary-field-value { white-space: pre-wrap; word-break: break-all; font-size: 11px; line-height: 1.5; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  th { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <h1>MetaGPT Dashboard</h1>
  <div class="badge">
    <div class="dot" id="containerDot"></div>
    <span id="containerStatus">checking...</span>
  </div>
  <button class="btn" id="btnStart" onclick="containerAction('start')" title="Start container">Start</button>
  <button class="btn" id="btnRestart" onclick="containerAction('restart')" title="Restart container">Restart</button>
  <button class="btn danger" id="btnStop" onclick="containerAction('stop')" title="Stop container">Stop</button>
  <button class="btn danger" id="btnRemove" onclick="confirmRemove()" title="Stop and remove container">Remove</button>
</header>

<main>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div style="display:flex;gap:4px">
        <button id="tabProjects" class="btn primary" onclick="switchSidebarTab('projects')"
                style="padding:2px 8px;font-size:10px">Projects</button>
        <button id="tabLogs" class="btn" onclick="switchSidebarTab('logs')"
                style="padding:2px 8px;font-size:10px">Logs</button>
      </div>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="btn" id="btnSummary" onclick="showSummary()"
                style="padding:2px 8px;font-size:10px;display:none">summary</button>
        <button class="btn" onclick="refreshSidebar()" style="padding:2px 8px;font-size:10px">↺</button>
      </div>
    </div>
    <div class="project-list" id="projectList">
      <div style="padding:12px;color:var(--muted)">Loading...</div>
    </div>
    <div class="project-list" id="logList" style="display:none">
      <div style="padding:12px;color:var(--muted)">No logs yet.</div>
    </div>
  </aside>

  <div class="content">
    <div class="form-area">
      <div class="form-row">
        <div class="field" style="flex:1">
          <label>Prompt / Idea</label>
          <textarea id="ideaInput" placeholder="Write a CLI snake game with color support..."></textarea>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Project Name</label>
          <input id="projectName" type="text" placeholder="auto-derived" style="width:180px">
        </div>
        <div class="field">
          <label>Model</label>
          <div style="display:flex;gap:4px;align-items:center">
            <select id="modelSelect"></select>
            <button class="btn" onclick="openModelsModal()" title="Manage models" style="padding:3px 7px;font-size:13px;line-height:1">⚙</button>
          </div>
        </div>
        <div class="field">
          <label>Rounds</label>
          <input id="roundsInput" type="number" value="5" min="1" max="20" style="width:70px">
        </div>
        <div class="field" style="justify-content:flex-end">
          <label>&nbsp;</label>
          <div style="display:flex;gap:6px;align-items:center">
            <label style="display:flex;align-items:center;gap:4px;margin:0;cursor:pointer">
              <input type="checkbox" id="codeReview" checked> review
            </label>
            <label style="display:flex;align-items:center;gap:4px;margin:0;cursor:pointer">
              <input type="checkbox" id="runTests"> tests
            </label>
          </div>
        </div>
      </div>
      <div class="form-row actions">
        <button class="btn primary" onclick="runMetaGPT(false)" id="btnNew">+ New Project</button>
        <button class="btn" onclick="runMetaGPT(true)" id="btnInc" disabled>▶ Run Incremental</button>
        <button class="btn" id="btnBrowse" onclick="browseFiles()"
                style="display:none;padding:5px 10px">⊞ Files</button>
        <button class="btn" id="btnDownload" onclick="downloadProject()"
                style="display:none;padding:5px 10px">↓ ZIP</button>
        <div class="selected-label" id="selectedLabel" style="display:none">
          Selected: <span id="selectedName"></span>
        </div>
        <button class="btn" onclick="clearSelection()" id="btnClear" style="display:none">✕ clear</button>
      </div>
    </div>

    <!-- Pipeline progress strip (populated by resetPipeline(), grows dynamically per round) -->
    <div id="pipelineStrip" style="display:flex;align-items:center;flex-shrink:0;border-bottom:1px solid var(--border);padding:6px 16px;background:var(--surface);gap:2px;overflow-x:auto"></div>

    <!-- Log view -->
    <div id="viewLog" style="display:flex;flex-direction:column;flex:1;overflow:hidden">
      <div class="log-header">
        <span>Live Output</span>
        <div class="log-status">
          <div class="log-dot" id="logDot"></div>
          <span id="logStatusText">idle</span>
          <button class="btn" onclick="clearLog()" style="padding:2px 8px;font-size:10px;margin-left:8px">clear</button>
          <button class="btn danger" id="btnCancel" onclick="cancelRun()"
                  style="display:none;padding:2px 8px;font-size:10px">✕ cancel</button>
        </div>
      </div>
      <div class="log-output" id="logOutput">Ready. Select a project or enter a new idea above.
</div>
    </div>

    <!-- File browser view -->
    <div id="viewBrowser" style="display:none;flex-direction:column;flex:1;overflow:hidden">
      <div class="log-header">
        <span id="browserTitle">Files</span>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn" onclick="downloadProject()" style="padding:2px 8px;font-size:10px">↓ ZIP</button>
          <button class="btn" onclick="showView('log')" style="padding:2px 8px;font-size:10px">← log</button>
        </div>
      </div>
      <div style="display:flex;flex:1;overflow:hidden">
        <div id="fileTree"></div>
        <div id="fileViewer"><span style="color:var(--muted)">Select a file.</span></div>
      </div>
    </div>
  </div>
</main>

<!-- Summary modal -->
<div id="summaryModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">Summary: <span id="summaryTitle"></span></span>
      <button class="btn" onclick="document.getElementById('summaryModal').style.display='none'">✕ close</button>
    </div>
    <div id="summaryContent"></div>
  </div>
</div>

<!-- Models modal -->
<div id="modelsModal" class="modal-overlay" style="max-width:600px;margin:0 auto">
  <div class="modal-box" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title">Manage Models</span>
      <button class="btn" onclick="closeModelsModal()">✕ close</button>
    </div>
    <table>
      <thead><tr>
        <th>Alias</th>
        <th>Model ID</th>
        <th style="width:50px"></th>
      </tr></thead>
      <tbody id="modelsTableBody"></tbody>
    </table>
    <div style="display:flex;gap:8px;align-items:flex-end;margin-top:16px">
      <div class="field" style="flex:1">
        <label>Alias</label>
        <input id="newAlias" type="text" placeholder="e.g. fast2">
      </div>
      <div class="field" style="flex:2">
        <label>Model ID</label>
        <input id="newModelId" type="text" placeholder="e.g. openai/model-name">
      </div>
      <button class="btn primary" onclick="addModel()">Add</button>
    </div>
  </div>
</div>

<script>
mermaid.initialize({ startOnLoad: false, theme: 'dark' });
let _mmdCounter = 0;

let selectedProject = null;
let currentES = null;
let currentRunId = null;
let sidebarTab = 'projects';

// ── Container ─────────────────────────────────────────────────────────────────

async function pollContainer() {
  try {
    const r = await fetch('/api/container');
    const data = await r.json();
    const dot = document.getElementById('containerDot');
    const status = document.getElementById('containerStatus');
    dot.className = 'dot' + (data.running ? ' running' : '');
    status.textContent = data.status;
    const exists = data.exists;
    const running = data.running;
    document.getElementById('btnStart').disabled = running;
    document.getElementById('btnRestart').disabled = !exists;
    document.getElementById('btnStop').disabled = !running;
    document.getElementById('btnRemove').disabled = !exists;
  } catch (e) {
    document.getElementById('containerStatus').textContent = 'unreachable';
  }
}

async function containerAction(action) {
  appendLog(`[ui] Container ${action}...\n`, 'meta');
  await fetch(`/api/container/${action}`, { method: 'POST' });
  await pollContainer();
}

function confirmRemove() {
  if (!confirm('Stop and remove the MetaGPT container?\n\nThe workspace files will not be deleted. You can start a fresh container afterwards.')) return;
  containerAction('remove');
}

// ── Sidebar tabs ──────────────────────────────────────────────────────────────

function switchSidebarTab(tab) {
  sidebarTab = tab;
  document.getElementById('projectList').style.display = tab === 'projects' ? '' : 'none';
  document.getElementById('logList').style.display = tab === 'logs' ? '' : 'none';
  document.getElementById('tabProjects').className = 'btn' + (tab === 'projects' ? ' primary' : '');
  document.getElementById('tabLogs').className = 'btn' + (tab === 'logs' ? ' primary' : '');
  if (tab === 'logs') loadLogs();
}

function refreshSidebar() {
  if (sidebarTab === 'projects') loadProjects();
  else loadLogs();
}

// ── Projects ──────────────────────────────────────────────────────────────────

async function loadProjects() {
  const list = document.getElementById('projectList');
  list.innerHTML = '<div style="padding:12px;color:var(--muted)">Loading...</div>';
  const r = await fetch('/api/projects');
  const projects = await r.json();
  if (!projects.length) {
    list.innerHTML = '<div style="padding:12px;color:var(--muted)">No projects yet.</div>';
    return;
  }
  list.innerHTML = '';
  for (const p of projects) {
    const item = document.createElement('div');
    item.className = 'project-item' + (selectedProject === p.name ? ' selected' : '');
    item.dataset.name = p.name;
    const date = new Date(p.modified * 1000).toLocaleDateString();
    const incTag = p.incremental ? '<span class="tag inc">inc</span>' : '';
    item.innerHTML = `
      <div class="pname" style="display:flex;align-items:center;gap:4px">
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis">${escHtml(p.name)}${incTag}</span>
        <button class="del-btn btn danger" onclick="deleteProject(event,'${escHtml(p.name)}')"
                style="padding:1px 5px;font-size:10px;flex-shrink:0">✕</button>
      </div>
      <div class="pmeta">${date} · ${p.file_count} files${p.snippet ? ' · ' + escHtml(p.snippet.slice(0, 40)) : ''}</div>
    `;
    item.onclick = () => selectProject(p.name);
    list.appendChild(item);
  }
}

function selectProject(name) {
  selectedProject = name;
  document.getElementById('projectName').value = name;
  document.getElementById('selectedName').textContent = name;
  document.getElementById('selectedLabel').style.display = '';
  document.getElementById('btnClear').style.display = '';
  document.getElementById('btnInc').disabled = false;
  document.getElementById('btnBrowse').style.display = '';
  document.getElementById('btnDownload').style.display = '';
  document.getElementById('btnSummary').style.display = '';
  document.querySelectorAll('.project-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.name === name);
  });
}

function clearSelection() {
  selectedProject = null;
  document.getElementById('projectName').value = '';
  document.getElementById('selectedLabel').style.display = 'none';
  document.getElementById('btnClear').style.display = 'none';
  document.getElementById('btnInc').disabled = true;
  document.getElementById('btnBrowse').style.display = 'none';
  document.getElementById('btnDownload').style.display = 'none';
  document.getElementById('btnSummary').style.display = 'none';
  document.querySelectorAll('.project-item').forEach(el => el.classList.remove('selected'));
}

async function deleteProject(e, name) {
  e.stopPropagation();
  if (!confirm(`Delete project "${name}"?\n\nThis permanently removes all generated files.`)) return;
  const r = await fetch(`/api/projects/${encodeURIComponent(name)}`, { method: 'DELETE' });
  if (!r.ok) {
    const err = await r.json();
    alert(`Delete failed: ${err.detail}`);
    return;
  }
  if (selectedProject === name) clearSelection();
  loadProjects();
}

// ── Artifacts summary ─────────────────────────────────────────────────────────

async function showSummary() {
  if (!selectedProject) return;
  document.getElementById('summaryTitle').textContent = selectedProject;
  document.getElementById('summaryContent').innerHTML = '<div style="color:var(--muted);padding:8px">Loading...</div>';
  document.getElementById('summaryModal').style.display = 'block';
  const r = await fetch(`/api/projects/${encodeURIComponent(selectedProject)}/summary`);
  if (!r.ok) {
    document.getElementById('summaryContent').innerHTML = '<div style="color:var(--red)">Failed to load summary.</div>';
    return;
  }
  const data = await r.json();
  document.getElementById('summaryContent').innerHTML = renderSummary(data);
}

function renderSummary(data) {
  const sections = [
    ['Product Manager', data.prd, ['Project Name', 'Refined Requirements', 'Refined User Stories']],
    ['Architect', data.system_design, ['Refined Data structures and interfaces', 'Refined File list']],
    ['Project Manager', data.task, ['Required packages', 'Refined Task list']],
    ['Engineer', data.code_plan, ['Development Plan', 'Incremental Change']],
  ];
  return sections.map(([title, obj, fields]) => {
    if (!obj) return `<div class="summary-card"><div class="summary-card-title">${title}</div><div style="color:var(--muted);font-size:11px">No data yet.</div></div>`;
    const fieldHtml = fields.map(f => {
      const val = obj[f];
      if (!val) return '';
      const display = Array.isArray(val) ? val.join('\n') : String(val);
      return `<div class="summary-field-label">${escHtml(f)}</div>
              <div class="summary-field-value">${escHtml(display.slice(0, 1200))}</div>`;
    }).join('');
    return `<div class="summary-card"><div class="summary-card-title">${title}</div>${fieldHtml}</div>`;
  }).join('');
}

// ── File browser ──────────────────────────────────────────────────────────────

function showView(name) {
  document.getElementById('viewLog').style.display = name === 'log' ? 'flex' : 'none';
  document.getElementById('viewBrowser').style.display = name === 'browser' ? 'flex' : 'none';
}

async function browseFiles() {
  if (!selectedProject) return;
  document.getElementById('browserTitle').textContent = `Files — ${selectedProject}`;
  document.getElementById('fileTree').innerHTML = '<div style="padding:8px;color:var(--muted)">Loading...</div>';
  document.getElementById('fileViewer').innerHTML = '<span style="color:var(--muted)">Select a file.</span>';
  showView('browser');
  const r = await fetch(`/api/projects/${encodeURIComponent(selectedProject)}/files`);
  if (!r.ok) {
    document.getElementById('fileTree').innerHTML = '<div style="padding:8px;color:var(--red)">Failed to load files.</div>';
    return;
  }
  const files = await r.json();
  renderFileTree(files);
}

function renderFileTree(files) {
  const tree = document.getElementById('fileTree');
  tree.innerHTML = '';
  for (const f of files) {
    const el = document.createElement('div');
    el.className = 'tree-item';
    el.textContent = f.path;
    el.title = `${f.path} (${f.size.toLocaleString()} bytes)`;
    el.onclick = () => loadFile(f.path, el);
    tree.appendChild(el);
  }
}

async function loadFile(relPath, el) {
  document.querySelectorAll('.tree-item').forEach(d => d.classList.remove('selected'));
  el.classList.add('selected');
  const viewer = document.getElementById('fileViewer');
  viewer.innerHTML = '<span style="color:var(--muted)">Loading...</span>';
  const r = await fetch(`/api/projects/${encodeURIComponent(selectedProject)}/file?path=${encodeURIComponent(relPath)}`);
  if (!r.ok) { viewer.textContent = 'Failed to load file.'; return; }
  const data = await r.json();
  viewer.innerHTML = '';
  if (data.binary) {
    const p = document.createElement('div');
    p.style.cssText = 'color:var(--muted);padding:8px';
    p.textContent = `[${data.message}]`;
    viewer.appendChild(p);
    return;
  }
  if (relPath.endsWith('.mmd')) {
    renderMmdFile(data.content, viewer);
  } else if (relPath.endsWith('.md')) {
    renderMdFile(data.content, viewer);
  } else {
    const pre = document.createElement('pre');
    pre.textContent = data.content;
    viewer.appendChild(pre);
  }
}

// ── Mermaid rendering ─────────────────────────────────────────────────────────

function renderMmdFile(content, container) {
  container.innerHTML = '';
  const toggle = document.createElement('div');
  toggle.style.cssText = 'display:flex;gap:6px;margin-bottom:8px';
  const rawBtn = document.createElement('button');
  rawBtn.className = 'btn'; rawBtn.textContent = 'Raw';
  const renderBtn = document.createElement('button');
  renderBtn.className = 'btn primary'; renderBtn.textContent = 'Rendered';
  toggle.appendChild(rawBtn); toggle.appendChild(renderBtn);
  container.appendChild(toggle);

  const rawView = document.createElement('pre');
  rawView.textContent = content;
  rawView.style.display = 'none';
  container.appendChild(rawView);

  const renderView = document.createElement('div');
  container.appendChild(renderView);

  rawBtn.onclick = () => { rawView.style.display = ''; renderView.style.display = 'none'; };
  renderBtn.onclick = () => { rawView.style.display = 'none'; renderView.style.display = ''; };

  const id = `mmd-${++_mmdCounter}`;
  mermaid.render(id, content).then(({ svg }) => {
    renderView.innerHTML = svg;
  }).catch(err => {
    renderView.textContent = `Render error: ${err.message}`;
  });
}

function renderMdFile(content, container) {
  container.innerHTML = '';
  const parts = content.split(/(```mermaid[\s\S]*?```)/g);
  for (const part of parts) {
    if (part.startsWith('```mermaid')) {
      const code = part.replace(/^```mermaid\s*/, '').replace(/```$/, '').trim();
      const div = document.createElement('div');
      div.style.cssText = 'margin:8px 0;border:1px solid var(--border);border-radius:4px;padding:8px;overflow:auto';
      const id = `mmd-${++_mmdCounter}`;
      mermaid.render(id, code).then(({ svg }) => { div.innerHTML = svg; })
        .catch(err => { div.textContent = `[mermaid error: ${err.message}]`; });
      container.appendChild(div);
    } else if (part.trim()) {
      const pre = document.createElement('pre');
      pre.textContent = part;
      container.appendChild(pre);
    }
  }
}

// ── Download ──────────────────────────────────────────────────────────────────

function downloadProject(include = 'source') {
  if (!selectedProject) return;
  window.location = `/api/projects/${encodeURIComponent(selectedProject)}/download?include=${include}`;
}

// ── Run log history ───────────────────────────────────────────────────────────

async function loadLogs() {
  const list = document.getElementById('logList');
  list.innerHTML = '<div style="padding:12px;color:var(--muted)">Loading...</div>';
  const r = await fetch('/api/logs');
  const logs = await r.json();
  if (!logs.length) {
    list.innerHTML = '<div style="padding:12px;color:var(--muted)">No run logs yet.</div>';
    return;
  }
  list.innerHTML = '';
  for (const log of logs) {
    const item = document.createElement('div');
    item.className = 'project-item';
    item.innerHTML = `
      <div class="pname">${escHtml(log.project)}</div>
      <div class="pmeta">${log.timestamp} · ${(log.size / 1024).toFixed(1)} KB
        <button class="btn" onclick="viewLog('${escHtml(log.filename)}')"
                style="padding:1px 6px;font-size:10px;margin-left:6px">View</button>
      </div>
    `;
    list.appendChild(item);
  }
}

async function viewLog(filename) {
  showView('log');
  clearLog();
  appendLog(`[ui] Loading log: ${filename}\n`, 'meta');
  const r = await fetch(`/api/logs/${encodeURIComponent(filename)}`);
  if (!r.ok) { appendLog('[ui] Failed to load log.\n', 'err'); return; }
  const text = await r.text();
  clearLog();
  appendLog(text);
}

// ── Custom models ─────────────────────────────────────────────────────────────

async function refreshModelSelect() {
  const r = await fetch('/api/models');
  const models = await r.json();
  const sel = document.getElementById('modelSelect');
  const current = sel.value;
  sel.innerHTML = '';
  for (const [alias, modelId] of Object.entries(models)) {
    const opt = document.createElement('option');
    opt.value = alias;
    opt.textContent = `${alias} (${modelId.split('/').pop()})`;
    sel.appendChild(opt);
  }
  if (current && models[current]) sel.value = current;
}

async function openModelsModal() {
  document.getElementById('modelsModal').style.display = 'block';
  await renderModelsTable();
}

async function closeModelsModal() {
  document.getElementById('modelsModal').style.display = 'none';
  await refreshModelSelect();
}

async function renderModelsTable() {
  const r = await fetch('/api/models');
  const models = await r.json();
  const tbody = document.getElementById('modelsTableBody');
  tbody.innerHTML = '';
  for (const [alias, modelId] of Object.entries(models)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escHtml(alias)}</td>
      <td style="color:var(--muted)">${escHtml(modelId)}</td>
      <td><button class="btn danger" onclick="deleteModel('${escHtml(alias)}')"
              style="padding:1px 6px;font-size:10px">✕</button></td>
    `;
    tbody.appendChild(tr);
  }
}

async function addModel() {
  const alias = document.getElementById('newAlias').value.trim();
  const modelId = document.getElementById('newModelId').value.trim();
  if (!alias || !modelId) { alert('Both alias and model ID are required.'); return; }
  const r = await fetch('/api/models', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ alias, model_id: modelId }),
  });
  if (r.ok) {
    document.getElementById('newAlias').value = '';
    document.getElementById('newModelId').value = '';
    await renderModelsTable();
  }
}

async function deleteModel(alias) {
  if (!confirm(`Delete model alias "${alias}"?`)) return;
  await fetch(`/api/models/${encodeURIComponent(alias)}`, { method: 'DELETE' });
  await renderModelsTable();
}

// ── Run ───────────────────────────────────────────────────────────────────────

const ROLE_PATTERNS = [
  // Primary: role announcement lines emitted by roles that log _act
  [/\(Product\s*Manager\):\s*to do/i, 'pm'],
  [/\(Architect\):\s*to do/i,         'arch'],
  [/\(Project\s*Manager\):\s*to do/i, 'projmgr'],
  [/\(Engineer\):\s*to do/i,          'eng'],
  [/\(QA[^)]*\):\s*to do/i,           'qa'],
  // Fallback: action-level log lines for roles that skip the _act log (Engineer, QA)
  [/actions\.write_code(?:_review)?:run/i, 'eng'],
  [/actions\.write_test:run/i,             'qa'],
  [/actions\.run_code:run/i,               'qa'],
];

async function runMetaGPT(incremental) {
  const idea = document.getElementById('ideaInput').value.trim();
  if (!idea) { appendLog('[ui] Enter a prompt first.\n', 'err'); return; }

  const project = document.getElementById('projectName').value.trim();
  const model = document.getElementById('modelSelect').value;
  const rounds = parseInt(document.getElementById('roundsInput').value) || 5;
  const codeReview = document.getElementById('codeReview').checked;
  const runTests = document.getElementById('runTests').checked;

  if (incremental && !selectedProject && !project) {
    appendLog('[ui] Select a project for incremental mode.\n', 'err');
    return;
  }

  clearLog();
  resetPipeline();
  setRunning(true);

  const body = { idea, project: project || selectedProject || '', model, rounds, code_review: codeReview, run_tests: runTests };
  const r = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) {
    const err = await r.text();
    appendLog(`[ui] Failed to start run: ${err}\n`, 'err');
    setRunning(false);
    return;
  }
  const { run_id, project: resolvedProject } = await r.json();
  currentRunId = run_id;
  localStorage.setItem('activeRunId', run_id);
  localStorage.setItem('activeProject', resolvedProject);
  appendLog(`[ui] Run started → project: ${resolvedProject}\n`, 'meta');

  connectStream(run_id);
}

function connectStream(run_id) {
  if (currentES) currentES.close();
  currentES = new EventSource(`/api/stream/${run_id}`);
  currentES.onmessage = (e) => {
    if (e.data === '[DONE]') {
      completePipeline();
      setRunning(false);
      currentES.close();
      localStorage.removeItem('activeRunId');
      localStorage.removeItem('activeProject');
      loadProjects();
      return;
    }
    for (const [pat, role] of ROLE_PATTERNS) {
      if (pat.test(e.data)) activatePipeStep(role);
    }
    if (/actions\.write_code:run/i.test(e.data)) {
      _engFileCount++;
      const step = document.querySelector(`.pipe-step[data-role="eng"][data-round="${_pipeRound}"]`);
      if (step) step.textContent = `Engineer (${_engFileCount})`;
    }
    appendLog(e.data + '\n');
  };
  currentES.onerror = () => {
    appendLog('[ui] Stream connection lost.\n', 'err');
    setRunning(false);
    currentES.close();
    localStorage.removeItem('activeRunId');
    localStorage.removeItem('activeProject');
  };
}

async function cancelRun() {
  if (!currentRunId) return;
  const btn = document.getElementById('btnCancel');
  btn.disabled = true;
  btn.textContent = 'cancelling...';
  await fetch(`/api/run/${currentRunId}/cancel`, { method: 'POST' });
  appendLog('[ui] Cancel requested.\n', 'warn');
}

// ── Pipeline ──────────────────────────────────────────────────────────────────

const ROLE_ORDER  = ['pm', 'arch', 'projmgr', 'eng', 'qa'];
const ROLE_LABELS = { pm: 'PM', arch: 'Architect', projmgr: 'ProjMgr', eng: 'Engineer', qa: 'QA' };
let _pipeRound = 1;
let _pipeLastIdx = -1; // highest role index activated in the current round
let _engFileCount = 0;

function _appendPipeRound(round) {
  const strip = document.getElementById('pipelineStrip');
  if (round > 1) {
    const sep = document.createElement('div');
    sep.style.cssText = 'padding:2px 8px;color:var(--accent2);font-size:10px;white-space:nowrap;flex-shrink:0';
    sep.textContent = `r${round}`;
    strip.appendChild(sep);
  }
  ROLE_ORDER.forEach((role, i) => {
    if (i > 0) {
      const arrow = document.createElement('div');
      arrow.className = 'pipe-arrow';
      arrow.textContent = '→';
      strip.appendChild(arrow);
    }
    const step = document.createElement('div');
    step.className = 'pipe-step';
    step.dataset.role = role;
    step.dataset.round = round;
    strip.appendChild(step);
    step.textContent = ROLE_LABELS[role];
  });
}

function activatePipeStep(role) {
  const roleIdx = ROLE_ORDER.indexOf(role);
  if (roleIdx === -1) return;

  // Role fires strictly before the last seen position → sequence went backward, new round
  if (roleIdx < _pipeLastIdx) {
    // Mark remaining steps of the finished round as done
    document.querySelectorAll(`.pipe-step[data-round="${_pipeRound}"]`).forEach(s => {
      s.classList.remove('active');
      s.classList.add('done');
    });
    _pipeRound++;
    _pipeLastIdx = -1;
    _appendPipeRound(_pipeRound);
    document.getElementById('pipelineStrip').scrollLeft = 999999;
  }

  // Update steps within the current round
  document.querySelectorAll(`.pipe-step[data-round="${_pipeRound}"]`).forEach(s => {
    const sIdx = ROLE_ORDER.indexOf(s.dataset.role);
    if (sIdx < roleIdx)      { s.classList.remove('active'); s.classList.add('done'); }
    else if (sIdx === roleIdx) { s.classList.add('active');   s.classList.remove('done'); }
  });
  _pipeLastIdx = roleIdx;
}

function completePipeline() {
  document.querySelectorAll(`.pipe-step[data-round="${_pipeRound}"]`).forEach(s => {
    s.classList.remove('active');
    s.classList.add('done');
  });
}

function resetPipeline() {
  _pipeRound = 1;
  _pipeLastIdx = -1;
  _engFileCount = 0;
  document.getElementById('pipelineStrip').innerHTML = '';
  _appendPipeRound(1);
}

// ── Log helpers ───────────────────────────────────────────────────────────────

function appendLog(text, cls) {
  const out = document.getElementById('logOutput');
  const span = document.createElement('span');
  if (cls) span.className = `line-${cls}`;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}

function clearLog() {
  document.getElementById('logOutput').textContent = '';
  resetPipeline();
}

function setRunning(active) {
  const dot = document.getElementById('logDot');
  dot.className = 'log-dot' + (active ? ' active' : '');
  document.getElementById('logStatusText').textContent = active ? 'running...' : 'idle';
  document.getElementById('btnNew').disabled = active;
  document.getElementById('btnInc').disabled = active || !selectedProject;
  document.getElementById('btnCancel').style.display = active ? '' : 'none';
  document.getElementById('btnCancel').disabled = false;
  document.getElementById('btnCancel').textContent = '✕ cancel';
  if (!active) currentRunId = null;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────────────

pollContainer();
setInterval(pollContainer, 5000);
loadProjects();
refreshModelSelect();
resetPipeline();

// Reconnect to an active run if the page was refreshed mid-run
(async () => {
  const savedRunId = localStorage.getItem('activeRunId');
  const savedProject = localStorage.getItem('activeProject');
  if (!savedRunId) return;
  const r = await fetch('/api/runs');
  const active = await r.json();
  if (!active.find(x => x.run_id === savedRunId)) {
    localStorage.removeItem('activeRunId');
    localStorage.removeItem('activeProject');
    return;
  }
  currentRunId = savedRunId;
  if (savedProject) selectProject(savedProject);
  appendLog('[ui] Reconnected to active run\n', 'meta');
  setRunning(true);
  connectStream(savedRunId);
})();
</script>
